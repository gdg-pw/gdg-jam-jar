server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # HTML, CSS i JS bez cache w przeglądarce: zmiana po pushu widoczna od razu
    location ~* \.(html|css|js)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
